name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Queue releases instead of cancelling

jobs:
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Create version PR + git tags + GitHub releases
      pull-requests: write # Open the Version Packages PR
      id-token: write # OIDC for npm Trusted Publishing + provenance attestation
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # RELEASE_PAT lets the version commit bypass branch protection.
          # Required scopes: repo, workflow. Falls back to GITHUB_TOKEN if unset.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🟢 Setup Node.js (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # `registry-url:` is required even for OIDC Trusted Publishing.
          # setup-node writes an .npmrc with `registry=…` AND
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` plus exports
          # NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX as a placeholder. Since we
          # don't override NODE_AUTH_TOKEN on the publish step, npm CLI 11.5+
          # recognises the unresolved placeholder, treats the registry as
          # unauthenticated, and engages OIDC TP. Removing this line drops the
          # `registry=` config too and OIDC TP silently never starts (ENEEDAUTH).

      - name: ⬆️ Upgrade npm for Trusted Publishing
        # npm Trusted Publishing requires npm CLI v11.5.1+.
        # The bundled npm 10.9.7 in the ubuntu-latest runner image is broken on
        # self-upgrade (`Cannot find module 'promise-retry'`), so install via pnpm
        # — PNPM_HOME is already on PATH, so the new npm shadows the bundled one.
        run: pnpm add -g npm@latest

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Version or Publish (npm)
        id: changesets
        # Pinned to the v1.8.0 commit SHA so a moved tag can't change publish behavior under us.
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: pnpm changeset publish
          commit: "release: version packages"
          title: "release: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — Trusted Publishing via OIDC.
          # Provenance is enabled in package.json's publishConfig.
          HUSKY: 0

      - name: 📝 Retitle release PR with package@version
        # changesets/action's `title` input is a static string — rewrite it to
        # `<name>@<version>` once the action has bumped package.json on
        # changeset-release/main. Skipped on publish runs and no-changeset runs
        # (pullRequestNumber is empty in both cases).
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin changeset-release/main
          VERSION=$(git show FETCH_HEAD:package.json | jq -r '.version')
          NAME=$(git show FETCH_HEAD:package.json | jq -r '.name')
          gh pr edit "${{ steps.changesets.outputs.pullRequestNumber }}" \
            --title "${NAME}@${VERSION}"
